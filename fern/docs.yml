# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: legislature.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: saintus-create
        repo: family-400693
        branch: main
      launch: dashboard
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
title: CA Leg Info | Documentation
tabs:
  home:
    display-name: Home
    icon: home
  API Reference:
    display-name: API Reference
    icon: puzzle
  docs:
    display-name: Docs
    icon: book
  changelog:
    display-name: Changelog
    icon: clock
navigation:
  - tab: home
    layout:
      - page: Home
        path: docs/pages/welcome.mdx
        slug: welcome
  - tab: docs
    layout:
      - section: Legal library
        contents:
          - page: California Codes
            path: docs/pages/codes/index.mdx
            icon: fa-duotone fa-books
      - section: California Codes
        contents:
          - page: California Constitution
            path: docs/pages/codes/cons.mdx
          - page: Business and Professions Code
            path: docs/pages/codes/bpc.mdx
          - page: Civil Code
            path: docs/pages/codes/civ.mdx
          - page: Code of Civil Procedure
            path: docs/pages/codes/ccp.mdx
          - page: Commercial Code
            path: docs/pages/codes/com.mdx
          - page: Corporations Code
            path: docs/pages/codes/corp.mdx
          - page: Education Code
            path: docs/pages/codes/edc.mdx
          - page: Elections Code
            path: docs/pages/codes/elec.mdx
          - page: Evidence Code
            path: docs/pages/codes/evid.mdx
          - page: Family Code
            path: docs/pages/codes/fam.mdx
          - page: Financial Code
            path: docs/pages/codes/fin.mdx
          - page: Fish and Game Code
            path: docs/pages/codes/fgc.mdx
          - page: Food and Agricultural Code
            path: docs/pages/codes/fac.mdx
          - page: Government Code
            path: docs/pages/codes/gov.mdx
          - page: Harbors and Navigation Code
            path: docs/pages/codes/hnc.mdx
          - page: Health and Safety Code
            path: docs/pages/codes/hsc.mdx
          - page: Insurance Code
            path: docs/pages/codes/ins.mdx
          - page: Labor Code
            path: docs/pages/codes/lab.mdx
          - page: Military and Veterans Code
            path: docs/pages/codes/mvc.mdx
          - page: Penal Code
            path: docs/pages/codes/pen.mdx
          - page: Probate Code
            path: docs/pages/codes/prob.mdx
          - page: Public Contract Code
            path: docs/pages/codes/pcc.mdx
          - page: Public Resources Code
            path: docs/pages/codes/prc.mdx
          - page: Public Utilities Code
            path: docs/pages/codes/puc.mdx
          - page: Revenue and Taxation Code
            path: docs/pages/codes/rtc.mdx
          - page: Streets and Highways Code
            path: docs/pages/codes/shc.mdx
          - page: Unemployment Insurance Code
            path: docs/pages/codes/uic.mdx
          - page: Vehicle Code
            path: docs/pages/codes/veh.mdx
          - page: Water Code
            path: docs/pages/codes/wat.mdx
          - page: Welfare and Institutions Code
            path: docs/pages/codes/wic.mdx
      - section: Research
        contents:
          - page: Court Rules
            path: docs/pages/court-rules-overview.mdx
            icon: fa-duotone fa-scale-balanced
          - page: Case Law
            path: docs/pages/case-law.mdx
            icon: fa-duotone fa-landmark
          - page: Bills and Measures
            path: docs/pages/bills-and-measures.mdx
            icon: fa-duotone fa-file-signature
          - page: Invitations to Comment
            path: docs/pages/invitations-to-comment.mdx
            icon: fa-duotone fa-comments
          - page: Public Records
            path: docs/pages/library/public-records/public-records.mdx
            icon: fa-duotone fa-folder-open
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-circle-question
  - tab: API Reference
    layout:
      - section: Existing references
        contents:
          - page: API reference sources
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-book
      - api: OpenAPI reference
        api-name: example-openapi
      - api: AsyncAPI reference
        api-name: example-asyncapi
  - tab: changelog
    layout:
      - changelog: docs/changelog
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#005A8C"
    dark: "#78B7F2"
  background:
    light: "#F9FBFC"
    dark: "#020508"
  border:
    light: "#CBD0D3"
    dark: "#282D31"
theme:
  page-actions: toolbar
  footer-nav: minimal
  tabs: bubble
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://leginfo.legislature.ca.gov/
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
js: custom.js
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
