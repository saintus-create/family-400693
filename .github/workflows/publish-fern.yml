name: Publish Fern Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fern CLI
        run: npm install -g fern-api@5.109.2

      - name: Validate Fern configuration
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern check

      - name: Publish documentation
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern generate --docs --instance legislature.docs.buildwithfern.com

      - name: Index California legal corpus in Ask Fern
        env:
          FERN_AI_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: python3 scripts/sync_fern_legal_corpus.py
