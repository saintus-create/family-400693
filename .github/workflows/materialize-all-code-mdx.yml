name: Materialize all code MDX

on:
  push:
    paths:
      - '.github/workflows/materialize-all-code-mdx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate all 30 code sections as MDX
        run: python3 scripts/generate_fern_sections_mdx.py --clean

      - name: Commit generated MDX and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fern/docs/pages/codes/sections
          git rm .github/workflows/materialize-all-code-mdx.yml
          git commit -m "Materialize all California code sections as MDX"
          git push
